[package]
name = "notehub-desktop"
version = "0.1.5"
description = "Notehub.md - A modular markdown note-taking app"
authors = ["Notehub Team"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "notehub_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-opener = "2"
zip = { version = "1.1.4", default-features = false, features = ["deflate", "time"] }
mime_guess = "2.0.5"
tauri-plugin-os = "2.0.0-beta.0"
tauri-plugin-android-fs = { version = "24", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "24"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
